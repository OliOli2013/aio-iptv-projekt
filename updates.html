<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Aktualizacje i nowości — AIO‑IPTV.pl</title>
  <meta name="description" content="Oś czasu aktualizacji: AIO Panel 9.7, IPTV Dream 6.5.1 i pozostałe zmiany na AIO‑IPTV.pl."/>
  <link href="pliki/logo.png" rel="icon"/>
  <link href="assets/css/site.css?v=next2" rel="stylesheet"/>
  <link href="assets/css/v3.css?v=3" rel="stylesheet"/>
  <link href="assets/css/v4-template.css?v=4" rel="stylesheet"/>
</head>
<body class="v3">

<main class="container">
  <section class="section">
    <div class="section-head">
      <div>
        <h2 class="section-title">Aktualizacje i nowości</h2>
        <p class="section-sub">Oś czasu zmian na stronie oraz w moich wtyczkach (AIO Panel, IPTV Dream i inne).</p>
      </div>
    </div>
  </section>

  <div class="card" id="updatesRoot">
    <h2 style="margin-top:0;">Timeline</h2>
    <p class="muted small">Skrót: w panelu bocznym masz ostatnie 3 wpisy. Tu jest pełna lista.</p>
    <div class="v4-timeline" id="updatesTimeline" aria-live="polite"></div>
  </div>
</main>

<script src="assets/js/site.js?v=next1"></script>
<script>
  (function(){
    'use strict';
    var root = document.getElementById('updatesTimeline');
    if(!root) return;
    function esc(s){
      return String(s||'')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }
    fetch('data/updates.json', {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : []; }).then(function(items){
      if(!Array.isArray(items) || !items.length){
        root.innerHTML = '<div class="muted small">Brak wpisów.</div>';
        return;
      }
      items = items.slice().sort(function(a,b){ return (Number(b.ts)||0) - (Number(a.ts)||0); });
      root.innerHTML = items.map(function(it, idx){
        var ts = Number(it.ts)||idx;
        var id = 'u' + ts;
        var type = String(it.type||'release');
        var date = String(it.date||'');
        var title = String(it.title||'');
        var details = String(it.details||'');
        return (
          '<div class="v4-tl-item" id="'+esc(id)+'">' +
            '<div class="v4-tl-top">' +
              '<span class="v4-tl-type">'+esc(type)+'</span>' +
              '<span class="v4-tl-date">'+esc(date)+'</span>' +
              '<span class="v4-tl-title">'+esc(title)+'</span>' +
            '</div>' +
            '<div class="v4-tl-details">'+esc(details)+'</div>' +
          '</div>'
        );
      }).join('');
    }).catch(function(){
      root.innerHTML = '<div class="muted small">Nie udało się wczytać aktualizacji.</div>';
    });
  })();
</script>

<script src="assets/js/v3.js?v=3"></script>
<script defer src="assets/js/layout-v4.js?v=4"></script>
</body>
</html>
