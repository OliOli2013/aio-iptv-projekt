<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AIO — test WP SMTP</title><style>
:root{color-scheme:dark}body{font:16px system-ui,sans-serif;background:#092530;color:#ecfbff;margin:0;padding:20px}main{max-width:650px;margin:9vh auto;background:#103b48;border:1px solid #347a88;border-radius:14px;padding:25px;line-height:1.55}button{background:#007d85;color:white;padding:12px 20px;border:0;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.6}a{color:#9eeef4}#result{white-space:pre-wrap}
</style></head><body><main><h1>AIO — test wysyłki WP SMTP</h1><p>Test dostępny tylko po zalogowaniu na konto właściciela AIO. Wyśle jedną wiadomość na <strong>adres konta administratora zapisany w D1</strong>. Nie ujawnia hasła.</p><p><button id="go">Wyślij wiadomość testową</button></p><p id="result" role="status" aria-live="polite">Przed testem sprawdź zmienną WP_SMTP_EMAIL w Cloudflare i wykonaj ponowne wdrożenie Pages.</p><p><a href="/community.html">Wróć do AIO</a></p></main><script>
const b=document.getElementById('go'),r=document.getElementById('result');b.addEventListener('click',async()=>{b.disabled=true;r.textContent='Trwa próba wysyłki…';try{const x=await fetch('/api/owner-smtp-test',{method:'POST',credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json'},body:'{}'});const j=await x.json();r.textContent=(j.ok?'OK: ':'Błąd: ')+(j.message||j.error||'Nieznany wynik')+(j.code?' ('+j.code+')':'');}catch(e){r.textContent='Błąd połączenia ze stroną.';}finally{b.disabled=false;}});
</script></body></html>
